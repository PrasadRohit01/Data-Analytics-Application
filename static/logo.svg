<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#15181C"/>

  <rect x="56" y="56" width="400" height="400" rx="28" fill="#1C2024" stroke="#2A2F35" stroke-width="2"/>

  <circle cx="92" cy="90" r="7" fill="#B8722F"/>
  <circle cx="118" cy="90" r="7" fill="#AEB7C0"/>
  <circle cx="144" cy="90" r="7" fill="#D9A62E"/>
  <line x1="72" y1="112" x2="440" y2="112" stroke="#2A2F35" stroke-width="2"/>

  <line x1="72" y1="400" x2="260" y2="400" stroke="#2A2F35" stroke-width="4"/>

  <rect x="88" y="260" width="36" height="140" rx="6" fill="#B8722F">
    <animate attributeName="y" values="260;230;260" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="height" values="140;170;140" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <rect x="140" y="210" width="36" height="190" rx="6" fill="#AEB7C0">
    <animate attributeName="y" values="210;180;210" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="height" values="190;220;190" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
  </rect>

  <rect x="192" y="160" width="36" height="240" rx="6" fill="#D9A62E">
    <animate attributeName="y" values="160;130;160" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="height" values="240;270;240" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
  </rect>

  <circle cx="360" cy="270" r="72" fill="none" stroke="#33373C" stroke-width="16"/>
  <circle cx="360" cy="270" r="72" fill="none" stroke="#D9A62E" stroke-width="16"
          stroke-linecap="round" stroke-dasharray="452" stroke-dashoffset="130"
          transform="rotate(-90 360 270)">
    <animate attributeName="stroke-dashoffset" values="130;95;130" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>